name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 업로드(build)와 배포(deploy)를 나눈다: 한 작업 안에서 올리자마자 배포하면
# 큰 사이트(음악 파일)에서 "No artifacts named github-pages" 로 실패하는 경우가 있다
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 베타: 개발 브랜치를 숨김 경로(/beta-lmswurlh/)에 같이 올린다. 세이브는 js/beta.js가 실제 사이트와 분리한다.
      #   베타만 갱신하려면 Actions에서 이 워크플로를 수동 실행(workflow_dispatch)한다. 브랜치가 없으면 건너뛴다
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: claude/gracious-carson-t4o42k
          path: beta-lmswurlh
      - name: Prepare beta
        run: |
          if [ -d beta-lmswurlh ]; then
            rm -rf beta-lmswurlh/.git beta-lmswurlh/.github
            sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' beta-lmswurlh/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
